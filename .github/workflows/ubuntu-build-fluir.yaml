name: ubuntu-build-fluir

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - name: Create Venv
        run: |
          python -m venv .venv
        working-directory: launcher
      - name: Setup Venv
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[build]
        working-directory: launcher
      - name: Build executable
        run: |
          source .venv/bin/activate
          python build.py
        working-directory: launcher
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Launcher
          path: |
            launcher/dist
          retention-days: 7

  build-language:
    runs-on: ubuntu-latest
    needs: [ build-launcher ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install libtinyxml2-dev libfmt-dev libgtest-dev \
          qt6-base-dev qt6-svg-dev qt6-qpa-plugins
      - name: Configure GCC
        run: cmake --preset gcc-release
      - name: Build GCC
        run: cmake --build --preset gcc-release
      - name: Run tests GCC
        run: ctest --preset gcc-release --output-junit test_results.xml
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Compiler-VM-Release
          path: |
            build/gcc-release/
            !build/gcc-release/**/*.o
            !build/gcc-release/**/*.obj
            !build/gcc-release/CMakeFiles/
          retention-days: 7
      - name: Download Editor Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
      - name: Build Installer
        run: cpack -G DEB -B packages
        working-directory: build/gcc-release
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Fluir-Installer
          path: build/gcc-release/packages/fluir-*.deb
