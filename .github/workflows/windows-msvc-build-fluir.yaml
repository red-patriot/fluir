name: windows-msvc-build-fluir

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev", "rc/*" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Create vcpkg cache dir
        run: New-Item -ItemType Directory -Force -Path vcpkg-cache
        shell: pwsh
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/windows-msvc-build-fluir.yaml') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Install Dependencies
        run: |
          vcpkg install tinyxml2 fmt re2 gtest --triplet x64-windows
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
      - name: Setup Developer Command Prompt and Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset msvc-release
          cmake --build --preset msvc-release
          ctest --preset msvc-release
        shell: cmd
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MSVC-Release
          path: |
            build/msvc-release/
            !build/msvc-release/**/*.o
            !build/msvc-release/**/*.obj
            !build/msvc-release/CMakeFiles/
          retention-days: 7
  build-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - name: Create Venv
        run: |
          python -m venv .venv
        working-directory: launcher
      - name: Setup Venv
        run: |
          .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -e .[build]
        working-directory: launcher
      - name: Build executable
        run: |
          .venv/Scripts/activate
          python build.py
        working-directory: launcher
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Launcher
          path: |
            launcher/dist/
          retention-days: 7
